services:
  codex-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.codex-sandbox
    image: orquesta-codex-sandbox:local
    container_name: codex-orquesta-sandbox
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /home/codex
      CODEX_HOME: /home/codex/.codex
      TERM: xterm-256color
    volumes:
      - .:/workspace:rw
      - ./.codex-docker-home:/home/codex/.codex:rw
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 8g
    cpus: 4
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    command: ["bash"]
