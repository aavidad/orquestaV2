<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">Eventos, observabilidad y resiliencia</title>
  <desc id="desc">Servicio productor publica eventos en un broker; consumidores procesan, observabilidad correlaciona y resiliencia gestiona fallos.</desc>
  <defs>
    <style>
      .bg{fill:#fbfdff}
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.8;rx:14}
      .prod{fill:#dff6ff;stroke:#0369a1;stroke-width:2;rx:14}
      .broker{fill:#e7f8ed;stroke:#15803d;stroke-width:2;rx:14}
      .cons{fill:#fff4d6;stroke:#a16207;stroke-width:2;rx:14}
      .risk{fill:#fee2e2;stroke:#b91c1c;stroke-width:2;rx:14}
      .obs{fill:#f3e8ff;stroke:#7e22ce;stroke-width:2;rx:14}
      .text{font-family:Inter,Arial,sans-serif;fill:#0f172a;font-size:19px;font-weight:700}
      .small{font-family:Inter,Arial,sans-serif;fill:#334155;font-size:14px;font-weight:500}
      .arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#7e22ce;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrowPurple)}
      .red{stroke:#b91c1c;stroke-width:2.5;fill:none;marker-end:url(#arrowRed)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7e22ce"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="660"/>
  <text x="560" y="58" text-anchor="middle" class="text">Integracion asincrona con control operativo</text>

  <rect x="70" y="140" width="190" height="96" class="prod"/>
  <text x="165" y="174" text-anchor="middle" class="text">Productor</text>
  <text x="165" y="200" text-anchor="middle" class="small">cambio de expediente</text>

  <rect x="345" y="122" width="220" height="132" class="broker"/>
  <text x="455" y="160" text-anchor="middle" class="text">Broker / cola</text>
  <text x="455" y="187" text-anchor="middle" class="small">desacopla y amortigua</text>
  <text x="455" y="210" text-anchor="middle" class="small">reintentos y orden parcial</text>

  <rect x="665" y="80" width="180" height="82" class="cons"/>
  <text x="755" y="114" text-anchor="middle" class="text">Consumidor 1</text>
  <text x="755" y="139" text-anchor="middle" class="small">notifica</text>

  <rect x="665" y="200" width="180" height="82" class="cons"/>
  <text x="755" y="234" text-anchor="middle" class="text">Consumidor 2</text>
  <text x="755" y="259" text-anchor="middle" class="small">actualiza vista</text>

  <rect x="665" y="320" width="180" height="82" class="cons"/>
  <text x="755" y="354" text-anchor="middle" class="text">Consumidor 3</text>
  <text x="755" y="379" text-anchor="middle" class="small">analitica operativa</text>

  <rect x="910" y="230" width="160" height="92" class="risk"/>
  <text x="990" y="263" text-anchor="middle" class="text">Cola error</text>
  <text x="990" y="289" text-anchor="middle" class="small">revision y reproceso</text>

  <rect x="140" y="480" width="270" height="94" class="obs"/>
  <text x="275" y="514" text-anchor="middle" class="text">Trazas</text>
  <text x="275" y="540" text-anchor="middle" class="small">correlacion extremo a extremo</text>

  <rect x="425" y="480" width="270" height="94" class="obs"/>
  <text x="560" y="514" text-anchor="middle" class="text">Metricas y alertas</text>
  <text x="560" y="540" text-anchor="middle" class="small">SLO, latencia, errores, cola</text>

  <rect x="710" y="480" width="270" height="94" class="obs"/>
  <text x="845" y="514" text-anchor="middle" class="text">Logs auditables</text>
  <text x="845" y="540" text-anchor="middle" class="small">quien, que, cuando, resultado</text>

  <path d="M260 188 H335" class="arrow"/>
  <path d="M565 188 C605 114 620 114 655 121" class="arrow"/>
  <path d="M565 188 H655" class="arrow"/>
  <path d="M565 188 C605 356 620 362 655 361" class="arrow"/>
  <path d="M845 241 H900" class="red"/>
  <path d="M455 254 V460" class="dash"/>
  <path d="M755 402 V460" class="dash"/>
  <path d="M990 322 C990 430 955 455 905 478" class="dash"/>

  <text x="286" y="178" class="small">evento</text>
  <text x="875" y="218" class="small">fallo no recuperable</text>
</svg>
