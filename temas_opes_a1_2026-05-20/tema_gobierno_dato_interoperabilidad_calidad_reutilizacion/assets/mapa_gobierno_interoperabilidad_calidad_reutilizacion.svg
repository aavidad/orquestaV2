<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de gobierno del dato, interoperabilidad, calidad y reutilizacion</title>
  <desc id="desc">Diagrama de capas que conecta responsabilidad, reglas, calidad, interoperabilidad semantica y reutilizacion de informacion publica.</desc>
  <defs>
    <style>
      .box{fill:#fff;stroke:#24405f;stroke-width:2;rx:8}
      .head{fill:#24405f}
      .txt{font:18px Arial,sans-serif;fill:#1f2933}
      .small{font:15px Arial,sans-serif;fill:#334155}
      .white{font:18px Arial,sans-serif;fill:#fff;font-weight:700}
      .arrow{stroke:#37607f;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .note{fill:#e7f0f7;stroke:#8eb4cf;stroke-width:1.5;rx:8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#37607f"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1080" height="580" fill="#f7fafc" stroke="#d8e2ea"/>
  <rect x="60" y="60" width="1000" height="56" class="head" rx="8"/>
  <text x="560" y="96" text-anchor="middle" class="white">Ruta logica del dato publico</text>
  <rect x="70" y="160" width="220" height="130" class="box"/>
  <text x="180" y="195" text-anchor="middle" class="txt">Gobierno</text>
  <text x="180" y="225" text-anchor="middle" class="small">responsables</text>
  <text x="180" y="250" text-anchor="middle" class="small">politicas</text>
  <text x="180" y="275" text-anchor="middle" class="small">catalogos</text>
  <rect x="325" y="160" width="220" height="130" class="box"/>
  <text x="435" y="195" text-anchor="middle" class="txt">Semantica</text>
  <text x="435" y="225" text-anchor="middle" class="small">modelos</text>
  <text x="435" y="250" text-anchor="middle" class="small">vocabularios</text>
  <text x="435" y="275" text-anchor="middle" class="small">metadatos</text>
  <rect x="580" y="160" width="220" height="130" class="box"/>
  <text x="690" y="195" text-anchor="middle" class="txt">Calidad</text>
  <text x="690" y="225" text-anchor="middle" class="small">reglas</text>
  <text x="690" y="250" text-anchor="middle" class="small">validacion</text>
  <text x="690" y="275" text-anchor="middle" class="small">linaje</text>
  <rect x="835" y="160" width="220" height="130" class="box"/>
  <text x="945" y="195" text-anchor="middle" class="txt">Reutilizacion</text>
  <text x="945" y="225" text-anchor="middle" class="small">licencia</text>
  <text x="945" y="250" text-anchor="middle" class="small">formatos</text>
  <text x="945" y="275" text-anchor="middle" class="small">valor publico</text>
  <path d="M290 225 H325" class="arrow"/>
  <path d="M545 225 H580" class="arrow"/>
  <path d="M800 225 H835" class="arrow"/>
  <rect x="95" y="360" width="930" height="120" class="note"/>
  <text x="560" y="395" text-anchor="middle" class="txt">La apertura fiable no empieza al publicar un fichero.</text>
  <text x="560" y="428" text-anchor="middle" class="small">Empieza al definir finalidad, responsable, significado, calidad, limites juridicos y condiciones de uso.</text>
  <text x="560" y="458" text-anchor="middle" class="small">Cuando esas piezas faltan, la interoperabilidad transmite ambiguedad y la reutilizacion pierde confianza.</text>
  <path d="M180 290 V350" class="arrow"/>
  <path d="M435 290 V350" class="arrow"/>
  <path d="M690 290 V350" class="arrow"/>
  <path d="M945 290 V350" class="arrow"/>
</svg>
