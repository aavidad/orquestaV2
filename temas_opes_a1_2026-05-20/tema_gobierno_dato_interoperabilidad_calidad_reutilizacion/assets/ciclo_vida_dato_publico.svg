<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de vida del dato publico</title>
  <desc id="desc">Flujo circular con etapas de planificacion, captura, validacion, uso, intercambio, publicacion y conservacion.</desc>
  <defs>
    <style>
      .node{fill:#ffffff;stroke:#1e4e5f;stroke-width:2;rx:8}
      .txt{font:17px Arial,sans-serif;fill:#1f2933}
      .small{font:14px Arial,sans-serif;fill:#334155}
      .arrow{stroke:#2f6f7e;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .center{fill:#e8f4f2;stroke:#7db2aa;stroke-width:2;rx:10}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6f7e"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1080" height="520" fill="#f8fbfb" stroke="#d7e7e5"/>
  <rect x="455" y="215" width="210" height="110" class="center"/>
  <text x="560" y="255" text-anchor="middle" class="txt">Controles transversales</text>
  <text x="560" y="282" text-anchor="middle" class="small">finalidad, minimizacion,</text>
  <text x="560" y="305" text-anchor="middle" class="small">seguridad, calidad y linaje</text>
  <rect x="475" y="60" width="170" height="78" class="node"/>
  <text x="560" y="93" text-anchor="middle" class="txt">Planificar</text>
  <text x="560" y="118" text-anchor="middle" class="small">finalidad y responsable</text>
  <rect x="780" y="120" width="190" height="78" class="node"/>
  <text x="875" y="153" text-anchor="middle" class="txt">Capturar</text>
  <text x="875" y="178" text-anchor="middle" class="small">origen y validacion</text>
  <rect x="820" y="370" width="190" height="78" class="node"/>
  <text x="915" y="403" text-anchor="middle" class="txt">Intercambiar</text>
  <text x="915" y="428" text-anchor="middle" class="small">base, formato, trazas</text>
  <rect x="465" y="420" width="190" height="78" class="node"/>
  <text x="560" y="453" text-anchor="middle" class="txt">Publicar</text>
  <text x="560" y="478" text-anchor="middle" class="small">licencia y metadatos</text>
  <rect x="110" y="370" width="190" height="78" class="node"/>
  <text x="205" y="403" text-anchor="middle" class="txt">Conservar</text>
  <text x="205" y="428" text-anchor="middle" class="small">archivo o eliminacion</text>
  <rect x="150" y="120" width="190" height="78" class="node"/>
  <text x="245" y="153" text-anchor="middle" class="txt">Usar</text>
  <text x="245" y="178" text-anchor="middle" class="small">tramitar y decidir</text>
  <path d="M645 99 C720 100 760 118 780 145" class="arrow"/>
  <path d="M900 198 C960 250 960 320 928 370" class="arrow"/>
  <path d="M820 420 C760 468 710 468 655 460" class="arrow"/>
  <path d="M465 460 C385 470 330 455 300 420" class="arrow"/>
  <path d="M190 370 C120 300 145 230 180 198" class="arrow"/>
  <path d="M340 145 C395 110 430 100 475 99" class="arrow"/>
</svg>
