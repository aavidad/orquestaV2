<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">Dimensiones de interoperabilidad</title>
  <desc id="desc">Comparacion entre interoperabilidad juridica, organizativa, semantica y tecnica.</desc>
  <style>
    .bg{fill:#f7fafc;stroke:#d9e2ec}
    .col{fill:#fff;stroke:#2d4059;stroke-width:2;rx:8}
    .head{fill:#2d4059}
    .h{font:18px Arial,sans-serif;fill:#fff;font-weight:700}
    .t{font:16px Arial,sans-serif;fill:#1f2933}
    .s{font:14px Arial,sans-serif;fill:#334155}
  </style>
  <rect x="20" y="20" width="1080" height="440" class="bg"/>
  <g transform="translate(60,70)">
    <rect width="235" height="330" class="col"/>
    <rect width="235" height="55" class="head" rx="8"/>
    <text x="117" y="35" text-anchor="middle" class="h">Juridica</text>
    <text x="20" y="90" class="t">Puede compartirse?</text>
    <text x="20" y="130" class="s">Base normativa</text>
    <text x="20" y="158" class="s">Finalidad</text>
    <text x="20" y="186" class="s">Limites y derechos</text>
    <text x="20" y="214" class="s">Conservacion</text>
  </g>
  <g transform="translate(315,70)">
    <rect width="235" height="330" class="col"/>
    <rect width="235" height="55" class="head" rx="8"/>
    <text x="117" y="35" text-anchor="middle" class="h">Organizativa</text>
    <text x="20" y="90" class="t">Quien hace que?</text>
    <text x="20" y="130" class="s">Proceso comun</text>
    <text x="20" y="158" class="s">Responsables</text>
    <text x="20" y="186" class="s">Acuerdos de servicio</text>
    <text x="20" y="214" class="s">Gobierno de cambios</text>
  </g>
  <g transform="translate(570,70)">
    <rect width="235" height="330" class="col"/>
    <rect width="235" height="55" class="head" rx="8"/>
    <text x="117" y="35" text-anchor="middle" class="h">Semantica</text>
    <text x="20" y="90" class="t">Significa lo mismo?</text>
    <text x="20" y="130" class="s">Modelos de datos</text>
    <text x="20" y="158" class="s">Vocabularios</text>
    <text x="20" y="186" class="s">Metadatos</text>
    <text x="20" y="214" class="s">Equivalencias</text>
  </g>
  <g transform="translate(825,70)">
    <rect width="235" height="330" class="col"/>
    <rect width="235" height="55" class="head" rx="8"/>
    <text x="117" y="35" text-anchor="middle" class="h">Tecnica</text>
    <text x="20" y="90" class="t">Como se transmite?</text>
    <text x="20" y="130" class="s">API o servicio</text>
    <text x="20" y="158" class="s">Formato</text>
    <text x="20" y="186" class="s">Identificador</text>
    <text x="20" y="214" class="s">Seguridad y trazas</text>
  </g>
</svg>
