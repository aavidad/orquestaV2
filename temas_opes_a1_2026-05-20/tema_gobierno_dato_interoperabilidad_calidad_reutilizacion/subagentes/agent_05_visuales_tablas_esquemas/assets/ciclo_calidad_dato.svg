<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de calidad del dato</title>
  <desc id="desc">Ciclo de perfilado, reglas, validacion, correccion, publicacion y monitorizacion de calidad del dato.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}
      .node{fill:#fff;stroke:#cfd9e6;stroke-width:2}
      .center{fill:#243447}
      .arrow{stroke:#5f6f83;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .h{font:700 25px Arial,sans-serif;fill:#243447}
      .t{font:400 17px Arial,sans-serif;fill:#243447}
      .small{font:400 15px Arial,sans-serif;fill:#52606d}
      .white{fill:#fff}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f6f83"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="700"/>
  <text class="h" x="64" y="58">Calidad del dato como ciclo de mejora continua</text>
  <text class="small" x="64" y="88">La calidad se define respecto a una finalidad y se sostiene con reglas, evidencia y responsabilidad.</text>

  <circle class="center" cx="560" cy="355" r="118"/>
  <text class="white" x="493" y="342" style="font:700 27px Arial,sans-serif">Dato apto</text>
  <text class="white" x="465" y="377" style="font:400 18px Arial,sans-serif">para una finalidad</text>

  <rect class="node" x="462" y="120" width="196" height="78" rx="10"/>
  <text class="h" x="500" y="154">Perfilado</text>
  <text class="small" x="492" y="182">conocer el estado real</text>

  <rect class="node" x="770" y="228" width="220" height="78" rx="10"/>
  <text class="h" x="824" y="262">Reglas</text>
  <text class="small" x="806" y="290">definir umbrales y controles</text>

  <rect class="node" x="770" y="460" width="220" height="78" rx="10"/>
  <text class="h" x="818" y="494">Validacion</text>
  <text class="small" x="806" y="522">medir incumplimientos</text>

  <rect class="node" x="462" y="574" width="196" height="78" rx="10"/>
  <text class="h" x="498" y="608">Correccion</text>
  <text class="small" x="492" y="636">remediar causas</text>

  <rect class="node" x="130" y="460" width="220" height="78" rx="10"/>
  <text class="h" x="176" y="494">Publicacion</text>
  <text class="small" x="166" y="522">exponer con metadatos</text>

  <rect class="node" x="130" y="228" width="220" height="78" rx="10"/>
  <text class="h" x="166" y="262">Monitorizacion</text>
  <text class="small" x="166" y="290">seguir incidencias y uso</text>

  <path class="arrow" d="M640 180 C720 185 775 205 820 230"/>
  <path class="arrow" d="M905 308 C940 360 940 410 905 458"/>
  <path class="arrow" d="M800 532 C735 575 680 600 658 610"/>
  <path class="arrow" d="M462 615 C385 600 320 570 280 532"/>
  <path class="arrow" d="M210 460 C175 408 175 360 210 308"/>
  <path class="arrow" d="M300 230 C370 185 430 170 462 162"/>

  <text class="small" x="392" y="488">Dimensiones: exactitud, completitud, consistencia, actualidad, validez, unicidad y trazabilidad.</text>
</svg>
